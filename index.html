<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BLOOM (FLORESCER)</title>
<style>
:root{--p:#f7d6e6;--l:#c9a7eb;--v:#7b3fbf;--vd:#3b1c5e;--bg:#fff8fb;--c:#ff8a65;--tx:#2d1a45;--card:#fff;--mut:#7a6a8f;--sh:0 6px 20px rgba(123,63,191,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1229;--card:#2b1b3f;--tx:#f6e9ff;--mut:#bba6d4;--p:#4a2b63}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Georgia,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
.btn{background:linear-gradient(135deg,var(--v),#b06ad8);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;letter-spacing:.3px;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.btn.o{background:transparent;color:var(--v);border:1.5px solid var(--l)}.btn.s{padding:6px 12px;font-size:13px}.btn.c{background:linear-gradient(135deg,var(--c),#ffb199)}.btn.on{background:#2e9e6b}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--l);background:var(--card);margin:6px 0}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--sh);margin-bottom:16px;animation:fi .5s both}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.grad{background:linear-gradient(135deg,#7b3fbf,#c78ae0 60%,#f7a8c8);color:#fff}
h1,h2,h3{margin:.2em 0}.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.grid .card{margin:0}
.bar{height:12px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb199,#fff);border-radius:9px;transition:width 1s}.bar.d{background:var(--p)}.bar.d i{background:linear-gradient(90deg,var(--l),var(--v))}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none}
.tag{background:var(--p);color:var(--v);padding:3px 10px;border-radius:99px;font-size:12px;display:inline-block;margin:2px}
#app{display:flex;height:100%}#side{width:230px;background:var(--card);padding:18px 12px;overflow:auto;box-shadow:var(--sh);flex:none}
#side button,#bot button{display:block;width:100%;text-align:left;background:none;padding:10px 12px;border-radius:14px;font-size:15px}#side button.a,#bot button.a{background:var(--p);color:var(--v);font-weight:700}
#main{flex:1;overflow:auto;padding:20px;padding-bottom:90px}#in{max-width:980px;margin:auto}
#bot{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;white-space:nowrap;z-index:5}
#bot button{display:inline-block;width:auto;text-align:center;font-size:11px;padding:6px 10px}#bot b{display:block;font-size:20px}
@media(max-width:760px){#side{display:none}#bot{display:block}#main{padding:14px;padding-bottom:100px}}
.lg{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#f7d6e6,transparent 50%),radial-gradient(circle at 90% 90%,#c9a7eb,transparent 50%),#fff8fb;color:#2d1a45}
.lg .card{width:100%;max-width:400px;background:#fff}.logo{font-size:34px;font-weight:800;letter-spacing:4px;color:var(--v);text-align:center}
input,select,textarea{color:var(--tx)}input::placeholder,textarea::placeholder{color:var(--mut);opacity:.8}
.lg input,.lg select,.lg textarea{background:#fff;color:#2d1a45}.lg input::placeholder{color:#8a7a9f}
.m{color:#2d1a45}.m.me{color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .m{background:#5a3a78;color:#fff}:root:not([data-theme=light]) .m.me{background:#8a4fd0}:root:not([data-theme=light]) .tag,:root:not([data-theme=light]) .tabs button:not(.a),:root:not([data-theme=light]) .btn.o,:root:not([data-theme=light]) #side button.a,:root:not([data-theme=light]) #bot button.a{color:#f0defc}}
:root[data-theme=dark]{--bg:#1d1229;--card:#2b1b3f;--tx:#f6e9ff;--mut:#bba6d4;--p:#4a2b63}
.err{color:#d6336c;font-size:13px;min-height:16px}
#mod{position:fixed;inset:0;background:rgba(40,10,70,.5);display:none;place-items:center;z-index:20;padding:16px}#mod>div{background:var(--card);border-radius:24px;padding:22px;max-width:480px;width:100%;max-height:88vh;overflow:auto;animation:fi .3s}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30}#toast div{background:var(--vd);color:#fff;padding:10px 18px;border-radius:99px;margin-bottom:8px;animation:fi .3s;box-shadow:var(--sh)}
.pet{position:fixed;font-size:24px;pointer-events:none;z-index:40;animation:up 1.6s forwards}@keyframes up{to{transform:translate(var(--x),-220px) rotate(300deg);opacity:0}}
.sway{display:inline-block;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:rotate(8deg)}}
.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px}.m{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--p);align-self:flex-start;animation:fi .3s}.m.me{background:var(--v);color:#fff;align-self:flex-end}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{background:var(--p);color:var(--v);padding:8px 14px;border-radius:99px;white-space:nowrap}.tabs button.a{background:var(--v);color:#fff}
.day{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;text-align:center;font-size:12px;background:var(--p)}.day.dn{background:#d9f3e6}.day.cur{background:var(--c);color:#fff}.day.lk{opacity:.45}
.lock{filter:grayscale(1);opacity:.5}.hide{display:none!important}
</style></head><body>
<div id="toast"></div><div id="mod" onclick="if(event.target==this)X()"><div id="mb"></div></div><div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const PL=[["Ana","Aurora Criativa","Marketing","São Paulo","🌷","#f7d6e6",["Marketing","Social media"],92],["Juliana","Ju Moda","Moda","Rio de Janeiro","👗","#e8d4f7",["Moda","Estilo"],82],["Sofia","Sofia Tech","Tecnologia","Curitiba","💻","#d4e4f7",["Sites","Apps"],78],["Carolina","Studio Caro","Design","São Paulo","🎨","#ffd9cc",["Identidade visual","Design"],94],["Fernanda","Fê Branding","Branding","Belo Horizonte","🌿","#d9f3e6",["Branding","Naming"],89],["Mariana","Doce Mari","Confeitaria","Campinas","🧁","#ffe3ee",["Doces","Eventos"],76],["Beatriz","Bia Fotografia","Fotografia","São Paulo","📷","#e1d4ff",["Fotografia","Vídeo"],91],["Laura","Laura Social","Social Media","Recife","📱","#fff0c9",["Social media","Conteúdo"],84]].map((a,i)=>({id:i,n:a[0],biz:a[1],area:a[2],loc:a[3],em:a[4],col:a[5],comp:a[6],match:a[7],pts:700+i*210,conn:20+i*7,cn:i<3,off:a[6][0],seek:["Clientes","Parcerias","Fotos","Eventos"][i%4]}));
PL[0].n="Ana Souza";PL[0].biz="Boutique Aurora";PL[0].area="Moda";
const LV=[["SEMENTE",0,"Criar perfil e apresentar seu negócio.","Badge Primeira Semente · Acesso ao feed"],["CONECTADA",300,"Fazer novas conexões.","Bloom Match · Explorar completo"],["COLABORADORA",1000,"Ajudar outras empreendedoras.","Duplas que florescem · Eventos exclusivos"],["PROTAGONISTA",2000,"Criar parcerias e oportunidades.","Publicar oportunidades · Destaque no ranking"],["EMBAIXADORA",3500,"Gerar negócios e inspirar a comunidade.","Mentorias · Selo dourado · Convites VIP"]];
const TBL=[["Completar perfil",50],["Nova conexão",20],["Participar de evento",30],["Fazer indicação",50],["Ajudar outra empreendedora",40],["Criar parceria",100],["Fechar negócio",200],["Compartilhar conhecimento",50],["Participar de desafio",30],["Criar ação colaborativa",150]];
const BG=[["🌱","Primeira Semente","Primeiro perfil criado.",1],["💜","Primeira Conexão","Primeira conexão realizada.",1],["🤝","Colaboradora","Primeira parceria.",1],["🌟","Protagonista","Criar várias oportunidades.",0],["🏆","Empreendedora Bloom","Completar o desafio de 7 dias.",0],["💡","Mentora","Ajudar outras empreendedoras.",1],["🌸","Florescimento","Alcançar o nível Embaixadora.",0]];
const EV=[["Workshop de Marketing","12 out","19h","Online","Estratégias de conteúdo para pequenos negócios.",48],["Networking Bloom","18 out","18h30","São Paulo","Noite de conexões e trocas.",72],["Mentoria para empreendedoras","25 out","10h","Online","Mentoria coletiva sobre precificação.",35],["Feira de negócios","8 nov","9h","Campinas","Exponha seu negócio.",120],["Encontro Bloom","15 nov","15h","Rio de Janeiro","Café e colaboração.",54]].map(e=>({n:e[0],d:e[1],h:e[2],l:e[3],t:e[4],c:e[5],on:0}));
const OP=[["Fotógrafa para campanha de moda","Clientes","Juliana","20 out","Rio de Janeiro","Fotografia"],["Designer para identidade visual","Projetos","Mariana","30 out","Campinas","Design"],["Parceria entre confeiteiras","Parcerias","Mariana","15 nov","Campinas","Confeitaria"],["Mentoria de vendas online","Mentorias","Sofia","10 nov","Online","Vendas"],["Fornecedor de embalagens","Fornecedores","Juliana","5 nov","São Paulo","Logística"],["Evento colaborativo de Natal","Eventos","Laura","1 dez","Recife","Organização"],["Co-criação de e-book","Colaborações","Fernanda","25 out","Online","Escrita"]].map(o=>({n:o[0],c:o[1],by:o[2],d:o[3],l:o[4],s:o[5],on:0}));
let S;
function init(name,biz,pts){S={name,biz,pts,conn:47,par:8,opp:12,neg:5,help:21,cn:new Set([0,1,2]),hist:[["+50","Perfil completo","Hoje"],["+20","Nova conexão","Hoje"],["+100","Nova parceria","Ontem"],["+40","Ajudou Juliana","Ontem"]],wk:0,wc:[0,0,0,0,0],wd:0,days:3,duo:2,duoDone:0,helped:0,badges:BG.map(b=>b[3]),
pars:[{n:"Campanha Outono",w:"Ana Souza",g:"Fotos + divulgação",p:70,d:"20 out",s:"Ativa"},{n:"Kit Presente Bloom",w:"Mariana",g:"Box com doces e papelaria",p:40,d:"5 nov",s:"Ativa"},{n:"Rebranding Aurora",w:"Fernanda",g:"Nova identidade",p:100,d:"Concluída",s:"Concluída"},{n:"Live de Moda",w:"Juliana",g:"Convite recebido",p:0,d:"30 out",s:"Recebido"},{n:"Workshop com Laura",w:"Laura",g:"Convite enviado",p:0,d:"12 nov",s:"Enviado"}],
nt:[["🌷","Ana aceitou sua conexão.","people"],["🤝","Você recebeu uma proposta de parceria.","par"],["🏆","Você desbloqueou um novo badge.","bdg"],["⭐","Você ganhou 50 Bloom Points.","wallet"],["🌱","Seu desafio semanal está esperando por você.","chal"]],
ch:{1:[["Oi Ana! Vi seu perfil, adorei 💜",0]],3:[["Vamos falar sobre a identidade da Aurora?",0]],0:[["Que tal uma campanha de fotos juntas?",0]],5:[["Topa uma parceria de doces?",0]]},
feed:[[1,"Fechei minha primeira campanha colaborativa! 🎉",12,0],[3,"Dica: padronize suas cores em todos os canais, a marca fica mais forte.",24,0],[5,"Procuro fotógrafa para ensaio de produtos. Alguém indica?",8,0],[6,"Workshop de fotografia com celular dia 12! Quem vem?",19,0]].map(f=>({a:f[0],t:f[1],l:f[2],lk:0,cm:[]}))}}
const lvl=()=>{let i=0;LV.forEach((l,k)=>{if(S.pts>=l[1])i=k});return i};
const av=(p,s)=>`<div class="av" style="background:${p.col};${s||''}">${p.em}</div>`;
function toast(t){const e=document.createElement("div");e.textContent=t;$("#toast").append(e);setTimeout(()=>e.remove(),2800)}
function burst(){for(let i=0;i<14;i++){const e=document.createElement("span");e.className="pet";e.textContent=["🌸","🌷","✨","🦋","🍃"][i%5];e.style.left=(20+Math.random()*60)+"vw";e.style.top="60vh";e.style.setProperty("--x",(Math.random()*160-80)+"px");document.body.append(e);setTimeout(()=>e.remove(),1700)}}
function M(h){$("#mb").innerHTML=h;$("#mod").style.display="grid"}function X(){$("#mod").style.display="none"}
function pts(n,why,t){const o=lvl();S.pts+=n;S.hist.unshift(["+"+n,why,"Agora"]);toast("✨ "+(t||why)+" · +"+n+" BLOOM POINTS");burst();if(lvl()>o){S.badges[3]=S.badges[3]||(lvl()>=3)?1:0;S.nt.unshift(["🏆","Novo nível: "+LV[lvl()][0],"jour"]);M(`<div style="text-align:center"><h1>🌱 SUA JORNADA FLORESCEU!</h1><p>Novo nível desbloqueado:</p><h2 style="color:var(--v)">${LV[lvl()][0]}</h2><p class=mut>${LV[lvl()][3]}</p><button class=btn onclick=X()>Continuar</button></div>`)}}
const nx=()=>LV[lvl()+1];
let route="home",sub={};
const NAV=[["home","🏠","Início"],["jour","🌱","Minha Jornada"],["exp","🔎","Explorar"],["match","💜","Matches"],["par","🤝","Parcerias"],["chal","🏆","Desafios"],["msg","💬","Mensagens"],["ai","🤖","Bloom IA"],["me","👤","Meu Perfil"]];
const MORE=[["feed","🌸","Comunidade"],["opp","✨","Oportunidades"],["ev","📅","Eventos"],["rank","🥇","Ranking"],["wallet","🌷","Bloom Points"],["notif","🔔","Notificações"]];
function go(r,s){route=r;sub=s||{};render();$("#main").scrollTop=0}
function login(){$("#root").innerHTML=`<div class=lg><div class=card style="text-align:center"><div class="logo"><span class=sway>🌸</span> BLOOM</div><p class=mut style="margin:0">Conecte. Floresça. Empreenda.</p><h3>Floresça suas conexões.</h3><div style="text-align:left"><input id=em type=email placeholder="E-mail"><input id=pw type=password placeholder="Senha"><label class=mut><input type=checkbox style="width:auto;margin-right:6px" onchange="$('#pw').type=this.checked?'text':'password'">Mostrar senha</label><div class="row sp"><label class=mut><input type=checkbox id=rm style="width:auto;margin-right:6px">Lembrar de mim</label><a href=# onclick="forgot();return false">Esqueci minha senha</a></div><div class=err id=er></div></div><button class=btn style="width:100%" onclick=doLogin()>ENTRAR</button><p><a href=# onclick="signup(0);return false">Criar minha conta</a></p><button class="btn o" style="width:100%" onclick="demo()">Entrar como visitante/demo</button><p class=mut style="font-size:12px">Demo: teste@bloom.com / Bloom123!</p><p class=mut style="font-size:12px">Uma conexão pode ser o começo de uma grande oportunidade.</p></div></div>`;if(localStorage&&0);}
function forgot(){M(`<h3>Recuperar senha</h3><p class=mut>Informe seu e-mail para receber o link.</p><input id=fe type=email placeholder="E-mail"><div class=err id=er2></div><button class=btn onclick="const e=$('#fe').value.trim();if(!/^\\S+@\\S+\\.\\S+$/.test(e))return $('#er2').textContent='E-mail inválido.';X();toast('Link enviado 💌')">Enviar link</button>`)}
function demo(){init("Ana Martins","Aurora Criativa",1850);S.demo=1;route="home";shell()}
function doLogin(){const e=$("#em").value.trim(),p=$("#pw").value;if(!/^\S+@\S+\.\S+$/.test(e))return $("#er").textContent="Informe um e-mail válido.";if(p.length<6)return $("#er").textContent="A senha precisa ter ao menos 6 caracteres.";if(e=="teste@bloom.com"&&p!="Bloom123!")return $("#er").textContent="Senha incorreta.";if(e=="teste@bloom.com")return demo();init(e.split("@")[0],"Meu Negócio",1850);shell()}
const ST=[["Qual é o seu nome?","text"],["Seu e-mail","email"],["Crie uma senha","password"],["Nome do negócio","text"],["Segmento","sel",["Moda","Marketing","Design","Confeitaria","Tecnologia","Fotografia","Outros"]],["Cidade/região","text"],["O que você oferece?","text"],["O que você procura?","text"],["Interesses","text"],["Suas experiências (formação, cursos, anos de atuação)","text"],["Objetivo principal","sel",["Encontrar clientes","Encontrar parceiras","Divulgar meu negócio","Aprender","Encontrar fornecedores","Participar de eventos","Criar projetos","Fazer networking","Outros"]],["Como conheceu o aplicativo?","sel",["Instagram","Indicação de amiga","Google","Evento","WhatsApp","Outros"]]];
let SU=[];
function signup(i){if(i==ST.length)return $("#root").innerHTML=`<div class=lg><div class=card style="text-align:center"><h1>🌱</h1><h2>Seu jardim está pronto para florescer 🌱</h2><button class=btn onclick=onb(0)>COMEÇAR</button></div></div>`;const s=ST[i];$("#root").innerHTML=`<div class=lg><div class=card><div class="bar d"><i style="width:${Math.round((i+1)/ST.length*100)}%"></i></div><p class=mut>Etapa ${i+1} de ${ST.length}</p><h2>${s[0]}</h2>${s[1]=="sel"?`<select id=v onchange="$('#vo').classList.toggle('hide',this.value!='Outros')">${s[2].map(o=>`<option>${o}`).join("")}</select><input id=vo class=hide placeholder="Escreva aqui...">`:`<input id=v type=${s[1]} value="${i<10&&SU[i]&&s[1]!="password"?SU[i]:""}">`+(s[1]=="password"?`<label class=mut><input type=checkbox style="width:auto;margin-right:6px" onchange="$('#v').type=this.checked?'text':'password'">Mostrar senha</label>`:"")}<div class=err id=er></div><div class=row sp><button class="btn o" onclick="${i?`signup(${i-1})`:"login()"}">Voltar</button><button class=btn onclick="nextS(${i})">Continuar</button></div></div></div>`}
function nextS(i){let v=$("#v").value.trim();if(v=="Outros"){v=$("#vo").value.trim();if(!v)return $("#er").textContent="Escreva a opção em \"Outros\"."}if(!v)return $("#er").textContent="Preencha este campo.";if(i==1&&!/^\S+@\S+\.\S+$/.test(v))return $("#er").textContent="E-mail inválido.";if(i==2&&v.length<6)return $("#er").textContent="Mínimo 6 caracteres.";SU[i]=v;signup(i+1)}
const OB=[["🌷","Conheça novas empreendedoras."],["🤝","Transforme conexões em colaboração."],["🏆","Participe de desafios."],["✨","Crie oportunidades reais."],["🌸","Faça seu negócio florescer."]];
function onb(i){const o=OB[i];$("#root").innerHTML=`<div class=lg><div class=card style="text-align:center"><div style="font-size:70px" class=sway>${o[0]}</div><h2>${o[1]}</h2><p>${OB.map((_,k)=>k==i?"●":"○").join(" ")}</p>${i<4?`<button class=btn onclick=onb(${i+1})>Próximo</button>`:`<button class=btn onclick=startNew()>COMEÇAR MINHA JORNADA</button>`}</div></div>`}
function startNew(){init(SU[0]||"Empreendedora",SU[3]||"Meu Negócio",50);S.exp=SU[9]||"";S.nt.unshift(["🌱","Bem-vinda ao BLOOM!","jour"]);shell();burst()}
function shell(){$("#root").innerHTML=`<div id=app><aside id=side><div class=logo style="text-align:left;font-size:24px">🌸 BLOOM</div><div id=sn></div></aside><main id=main><div id=in></div></main></div><nav id=bot></nav>`;render()}
function render(){const nv=(a)=>a.map(n=>`<button class="${route==n[0]?"a":""}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join("");
$("#sn").innerHTML=nv(NAV).replace(/<b>(.*?)<\/b>/g,"$1 ")+`<hr style="border-color:var(--p)">`+nv(MORE).replace(/<b>(.*?)<\/b>/g,"$1 ")+`<button onclick="go('set')">⚙️ Configurações</button>`;
$("#bot").innerHTML=nv(NAV.slice(0,5).concat([NAV[6],NAV[7],NAV[8]]))+nv([["feed","🌸","Mais"]]);
$("#in").innerHTML=`<div class="row sp" style="margin-bottom:12px"><span class=mut>BLOOM · Mais que conexões, oportunidades reais.</span><button class="btn o s" onclick="go('notif')">🔔 ${S.nt.length}</button></div>`+(V[route]||V.home)();
document.querySelectorAll(".bar i[data-w]").forEach(e=>{setTimeout(()=>e.style.width=e.dataset.w+"%",60)})}
const pb=(w,d)=>`<div class="bar ${d?"d":""}"><i style="width:0" data-w="${w}"></i></div>`;
const prog=()=>{const l=lvl(),n=nx();return n?Math.min(100,Math.round((S.pts-LV[l][1])/(n[1]-LV[l][1])*100)):100};
function jc(){const n=nx();return`<div class="card grad"><div class="row sp"><b>🌱 SUA JORNADA</b><button class="btn o s" style="color:#fff;border-color:#fff" onclick="go('jour')">Ver jornada</button></div><h1 style="margin:6px 0">${LV[lvl()][0]}</h1><h2 style="margin:0">${S.pts.toLocaleString("pt-BR")} BLOOM POINTS</h2><div style="margin:12px 0">${pb(prog())}</div><span>${n?(n[1]-S.pts)+" pontos para "+n[0]:"Nível máximo! 🌸"}</span></div>`}
const pc=(p,full)=>`<div class=card><div class=row onclick="prof(${p.id})" style="cursor:pointer">${av(p)}<div><b>${p.n}</b><br><span class=mut>${p.biz} · ${p.area}</span></div></div><p class=mut>📍 ${p.loc} · 💜 ${p.match}% compatível</p>${p.comp.map(c=>`<span class=tag>${c}</span>`).join("")}<div class=row style="margin-top:10px"><button class="btn s ${S.cn.has(p.id)?"on":""}" onclick="conn(${p.id})">${S.cn.has(p.id)?"Conectada ✓":"Conectar"}</button><button class="btn o s" onclick="go('msg',{c:${p.id}})">Mensagem</button><button class="btn o s" onclick="prof(${p.id})">Ver perfil</button></div></div>`;
function conn(i){if(S.cn.has(i)){S.cn.delete(i);S.conn--;toast("Conexão removida");render();return}S.cn.add(i);S.conn++;S.nt.unshift(["🌷",PL[i].n+" aceitou sua conexão.","people"]);pts(20,"Nova conexão","✨ NOVA CONEXÃO!");render()}
function prof(i){const p=PL[i];M(`<div class=row>${av(p,"width:70px;height:70px;font-size:36px")}<div><h2>${p.n}</h2><span class=mut>${p.biz} · ${p.area}<br>📍 ${p.loc}</span></div></div><p><i>“Ajudo mulheres a fazerem seus negócios florescerem com ${p.comp[0].toLowerCase()}.”</i></p><b>Competências</b><br>${p.comp.map(c=>`<span class=tag>${c}</span>`).join("")}<br><b>Interesses</b><br><span class=tag>Inovação</span><span class=tag>Colaboração</span><br><p><b>Ofereço:</b> ${p.off} · <b>Procuro:</b> ${p.seek}</p><div class=row sp style="text-align:center"><span><b>${p.conn}</b><br>Conexões</span><span><b>${3+i}</b><br>Parcerias</span><span><b>${2+i}</b><br>Projetos</span><span><b>${p.pts}</b><br>Points</span></div><div class=row style="margin-top:12px"><button class=btn onclick="conn(${i});X()">${S.cn.has(i)?"Conectada ✓":"Conectar"}</button><button class="btn o" onclick="X();go('msg',{c:${i}})">Mensagem</button><button class="btn o" onclick="X();parForm(${i})">Propor parceria</button><button class="btn o" onclick="X();toast('Indicação enviada 💌');pts(50,'Fazer indicação')">Indicar</button></div>`)}
function parForm(i){M(`<h3>🤝 Nova parceria</h3><input id=pn placeholder="Nome da parceria"><select id=pp>${PL.map(p=>`<option value=${p.id} ${p.id==i?"selected":""}>${p.n} — ${p.biz}`).join("")}</select><textarea id=pg placeholder="Objetivo"></textarea><input id=pd placeholder="Prazo (ex: 30 nov)"><div class=err id=er></div><button class=btn onclick=addPar()>Criar parceria</button>`)}
function addPar(){const n=$("#pn").value.trim(),g=$("#pg").value.trim();if(!n||!g)return $("#er").textContent="Preencha nome e objetivo.";S.pars.unshift({n,w:PL[$("#pp").value].n,g,p:0,d:$("#pd").value||"A definir",s:"Ativa"});S.par++;X();pts(100,"Nova parceria","🤝 PARCERIA BLOOM CRIADA!");go("par")}
const V={
home(){const mt=PL.filter(p=>!S.cn.has(p.id)).sort((a,b)=>b.match-a.match).slice(0,3);return`<h1>Bom dia, ${S.name.split(" ")[0]} 🌷</h1><p class=mut>Pronta para fazer novas conexões florescerem?</p>${jc()}<div class=card><b>🌟 Desafio da Semana</b><h3>Conheça 3 novas empreendedoras</h3><p class=mut>${S.wd?"Concluído! 🌷":"+50 BLOOM POINTS"}</p><button class=btn onclick="go('chal')">${S.wk?"Continuar":"COMEÇAR DESAFIO"}</button></div><h3>💜 Bloom Match</h3><p class=mut>Encontramos ${mt.length} possíveis conexões para você.</p><div class=grid>${mt.map(p=>pc(p)).join("")}</div><h3 style="margin-top:20px">🤝 Suas parcerias</h3>${S.pars.filter(p=>p.s=="Ativa").slice(0,2).map(parC).join("")}<h3>✨ Oportunidades para você</h3><div class=grid>${OP.slice(0,3).map((o,i)=>opC(o,i)).join("")}</div><h3 style="margin-top:20px">🌸 Comunidade Bloom</h3>${S.feed.slice(0,2).map(feedC).join("")}<div class="row">${MORE.map(m=>`<button class="btn o s" onclick="go('${m[0]}')">${m[1]} ${m[2]}</button>`).join("")}</div><p class=mut style="margin-top:20px;text-align:center">O BLOOM é uma comunidade digital criada para mulheres que querem transformar conexões em parcerias, conhecimento e oportunidades reais. Seu networking pode florescer.</p>`},
jour(){return`<h1>🌱 JORNADA BLOOM</h1>${jc()}<div class=card>${LV.map((l,i)=>`<div class=row sp onclick="lvM(${i})" style="padding:12px 0;cursor:pointer;border-bottom:1px solid var(--p);${S.pts<l[1]?"opacity:.55":""}"><span style="font-size:${22+i*6}px">${["🌱","🌿","🪴","🌷","🌸"][i]}</span><div style="flex:1"><b>${i+1} — ${l[0]}</b><br><span class=mut>${l[2]}</span></div><span>${i<=lvl()?"✓":"🔒 "+l[1]}</span></div>`).join("")}</div><h3>Conquistas</h3><div class=grid>${BG.map((b,i)=>`<div class="card ${S.badges[i]?"":"lock"}" style="text-align:center"><div style="font-size:38px">${b[0]}</div><b>${b[1]}</b><p class=mut>${b[2]}</p>${S.badges[i]?"Desbloqueado ✓":"🔒 Bloqueado"}</div>`).join("")}</div>`},
exp(){const q=(sub.q||"").toLowerCase(),a=sub.a||"";return`<h1>🔎 Explorar</h1><input placeholder="Buscar pessoas, negócios, áreas..." value="${sub.q||""}" oninput="sub.q=this.value;fl()"><div class=tabs>${["","Moda","Marketing","Design","Fotografia","Confeitaria","Tecnologia"].map(x=>`<button class="${a==x?"a":""}" onclick="sub.a='${x}';render()">${x||"Todos"}</button>`).join("")}</div><div class=grid id=gl>${PL.filter(p=>(!a||p.area==a)&&(p.n+p.biz+p.area+p.comp).toLowerCase().includes(q)).map(p=>pc(p)).join("")||"<p class=mut>Nenhuma empreendedora encontrada 🌱</p>"}</div>`},
match(){const l=PL.filter(p=>!S.cn.has(p.id)||1).sort((a,b)=>b.match-a.match);const i=(sub.i||0)%l.length,p=l[i];return`<h1>💜 BLOOM MATCH</h1><p class=mut>Seu Bloom Match</p><div class=card style="text-align:center"><div class=sway>${av(p,"margin:auto;width:90px;height:90px;font-size:48px")}</div><h2>${p.match}% de compatibilidade</h2><b>${p.n}</b> · ${p.biz}<br><span class=mut>${p.area} · ${p.loc}</span><p><b>Você:</b> ${S.demo?"Fotografia":"Seu serviço"} · <b>Ela:</b> ${p.comp[0]}</p><p>Possível parceria: <i>“Campanha de fotos + divulgação”</i></p><div class=row style="justify-content:center"><button class=btn onclick="conn(${p.id})">❤️ CONECTAR</button><button class="btn o" onclick="prof(${p.id})">✨ VER PERFIL</button><button class="btn o" onclick="go('msg',{c:${p.id}})">💬 CONVERSAR</button><button class="btn c" onclick="parForm(${p.id})">🚀 CRIAR PARCERIA</button></div><p><button class="btn o s" onclick="sub.i=${i+1};render()">Próximo match →</button></p></div>`},
par(){const t=sub.t||"Ativa",L=S.pars.filter(p=>p.s==t);return`<div class="row sp"><h1>🤝 MINHAS PARCERIAS</h1><button class=btn onclick=parForm()>Criar nova parceria</button></div><div class=tabs>${[["Ativa","Parcerias ativas"],["Concluída","Concluídas"],["Recebido","Convites recebidos"],["Enviado","Convites enviados"]].map(x=>`<button class="${t==x[0]?"a":""}" onclick="sub.t='${x[0]}';render()">${x[1]} (${S.pars.filter(p=>p.s==x[0]).length})</button>`).join("")}</div>${L.map(parC).join("")||"<p class=mut>Nada por aqui ainda 🌱</p>"}`},
chal(){const t=sub.t||"w";const T=[["w","Desafio da semana"],["d","7 dias"],["h","Eu posso ajudar"],["u","Duplas"],["r","Ranking"]];return`<h1>🏆 Desafios</h1><div class=tabs>${T.map(x=>`<button class="${t==x[0]?"a":""}" onclick="sub.t='${x[0]}';render()">${x[1]}</button>`).join("")}</div>`+CH[t]()},
msg(){const c=sub.c??1;const cv=S.ch[c]||(S.ch[c]=[]);return`<h1>💬 Mensagens</h1><div class=grid style="grid-template-columns:minmax(0,1fr)"><div class=card><div class=tabs>${[1,3,0,5].concat(sub.c!=null&&![1,3,0,5].includes(c)?[c]:[]).map(i=>`<button class="${c==i?"a":""}" onclick="go('msg',{c:${i}})">${PL[i].em} ${PL[i].n.split(" ")[0]}</button>`).join("")}</div><div class=row sp><b>${PL[c].n}</b><span><button class="btn o s" onclick="prof(${c})">Perfil</button> <button class="btn s" onclick="parForm(${c})">Propor parceria</button></span></div><div class=chat id=ch>${cv.map(m=>`<div class="m ${m[1]?"me":""}">${m[0]}</div>`).join("")}</div><div class=row><input id=mi style="flex:1" placeholder="Escreva uma mensagem..." onkeydown="if(event.key=='Enter')send(${c})"><button class="btn o s" onclick="$('#mi').value+='🌸'">😊</button><button class="btn s" onclick="send(${c})">Enviar</button></div></div></div>`},
ai(){const m=S.ai||(S.ai=[["Olá! O que você precisa hoje?",0]]);return`<h1>🤖 BLOOM IA</h1><div class=card><div class=chat id=ch>${m.map(x=>`<div class="m ${x[1]?"me":""}">${x[0]}</div>`).join("")}</div><div class=row>${["Preciso encontrar alguém que faça identidade visual","Quero fotos para meu negócio","Busco social media"].map(x=>`<button class="btn o s" onclick="ask('${x}')">${x}</button>`).join("")}</div><div class=row style="margin-top:8px"><input id=ai style="flex:1" placeholder="Digite o que você procura..." onkeydown="if(event.key=='Enter')ask()"><button class=btn onclick=ask()>Buscar</button></div></div>`},
me(){const l=lvl();return`<div class=card><div class=row>${av({em:"🌷",col:"#f7d6e6"},"width:84px;height:84px;font-size:44px")}<div><h1>${S.name}</h1><span class=mut>${S.biz} · Empreendedora · 📍 São Paulo</span><br><span class=tag>${LV[l][0]}</span></div></div><p>Ajudo negócios a florescerem com conexões reais.</p>${S.exp?`<p><b>Experiências:</b> ${S.exp}</p>`:""}<div class=grid>${[["Bloom Points",S.pts],["Conexões",S.conn],["Parcerias",S.par],["Oportunidades",S.opp],["Negócios gerados",S.neg],["Pessoas ajudadas",S.help]].map(s=>`<div class=card style="text-align:center"><h2>${s[1]}</h2>${s[0]}</div>`).join("")}</div><div class=row><button class=btn onclick=edit()>EDITAR PERFIL</button><button class="btn o" onclick="go('set')">⚙️ Configurações</button><button class="btn o" onclick="go('wallet')">🌷 Pontos</button></div></div>`},
feed(){return`<h1>🌸 Comunidade Bloom</h1><div class=card><textarea id=fp placeholder="Compartilhe uma conquista, dica ou oportunidade..."></textarea><div class=row sp><select id=ft style="width:auto"><option>Conquista<option>Dica<option>Oportunidade<option>Pedido de ajuda<option>Evento</select><button class=btn onclick=post()>Publicar</button></div></div>${S.feed.map(feedC).join("")}`},
opp(){const c=sub.c||"";return`<div class="row sp"><h1>✨ OPORTUNIDADES</h1><button class=btn onclick=oppForm()>+ Publicar</button></div><div class=tabs>${["","Parcerias","Clientes","Eventos","Mentorias","Projetos","Fornecedores","Colaborações"].map(x=>`<button class="${c==x?"a":""}" onclick="sub.c='${x}';render()">${x||"Todas"}</button>`).join("")}</div><div class=grid>${OP.map((o,i)=>!c||o.c==c?opC(o,i):"").join("")}</div>`},
ev(){return`<h1>📅 EVENTOS</h1><div class=grid>${EV.map((e,i)=>`<div class=card><span class=tag>${e.d} · ${e.h}</span><h3>${e.n}</h3><p class=mut>📍 ${e.l}<br>${e.t}<br>👥 ${e.c+e.on} participantes</p><button class="btn ${e.on?"on":""}" onclick="evp(${i})">${e.on?"Você está participando ✓":"PARTICIPAR"}</button></div>`).join("")}</div>`},
notif(){return`<h1>🔔 Notificações</h1>${S.nt.map((n,i)=>`<div class=card style="cursor:pointer;margin-bottom:10px" onclick="nt('${n[2]}',${i})">${n[0]} ${n[1]}</div>`).join("")}<button class="btn o s" onclick="S.nt=[];render()">Limpar</button>`},
rank(){const c=sub.c??0,N=["🌸 Conexões","🤝 Colaboração","💼 Negócios","💡 Inspiração","🌱 Parcerias"];const L=PL.map((p,i)=>({n:p.n,p:Math.round(p.pts*[.3,.25,.2,.28,.22][c]+((i*37+c*53)%90)),em:p.em})).concat([{n:S.name+" (você)",p:Math.round(S.pts*[.3,.25,.2,.28,.22][c]),em:"🌷",me:1}]).sort((a,b)=>b.p-a.p);return`<h1>🏆 RANKING BLOOM</h1><p class=mut>Cada tipo de contribuição conta.</p><div class=tabs>${N.map((x,i)=>`<button class="${c==i?"a":""}" onclick="sub.c=${i};render()">${x}</button>`).join("")}</div><div class=card><p><b>Minha posição: #${L.findIndex(x=>x.me)+1}</b></p>${L.map((x,i)=>`<div class=row sp style="padding:8px;${x.me?"background:var(--p);border-radius:12px":""}"><span>${i+1}. ${x.em} ${x.n}</span><b>${x.p} pts</b></div>`).join("")}</div>`},
wallet(){return`<h1>🌷 BLOOM POINTS</h1><div class="card grad"><h1>${S.pts.toLocaleString("pt-BR")}</h1>pontos</div><div class=grid><div class=card><h3>Como ganhar</h3>${TBL.map(t=>`<div class="row sp"><span>${t[0]}</span><b>+${t[1]}</b></div>`).join("")}</div><div class=card><h3>Histórico</h3>${S.hist.slice(0,12).map(h=>`<div class="row sp"><span><b>${h[0]}</b> ${h[1]}</span><span class=mut>${h[2]}</span></div>`).join("")}</div></div>`},
set(){return`<h1>⚙️ Configurações</h1>${["Configurações da conta","Privacidade","Notificações","Preferências","Segurança","Ajuda","Sobre o BLOOM"].map(x=>`<div class=card style="cursor:pointer;margin-bottom:10px" onclick="setM('${x}')">${x} ›</div>`).join("")}<button class="btn c" onclick="login()">SAIR DA CONTA</button>`}};
const CH={w(){const d=["Encontrar empreendedora 1","Encontrar empreendedora 2","Encontrar empreendedora 3","Enviar mensagem","Identificar possibilidade de parceria"];return`<div class=card><h2>🌟 DESAFIO BLOOM DA SEMANA</h2><h3>Conheça 3 novas empreendedoras</h3><p class=mut>Encontre três negócios interessantes, envie uma mensagem e descubra uma possibilidade de parceria.</p>${S.wk?d.map((t,i)=>`<label class=row style="padding:6px 0"><input type=checkbox style="width:auto" ${S.wc[i]?"checked":""} ${S.wd?"disabled":""} onchange="wchk(${i})"> ${t}</label>`).join("")+pb(S.wc.filter(x=>x).length*20,1):`<p>Recompensa: <b>+50 BLOOM POINTS</b></p><button class=btn onclick="S.wk=1;render()">COMEÇAR DESAFIO</button>`}${S.wd?"<h3>Você floresceu mais uma vez! 🌷</h3>":""}</div>`},
d(){const T=["Apresente seu negócio","Conheça 3 empreendedoras","Converse com uma nova conexão","Faça uma indicação","Crie uma ideia de parceria","Divulgue uma empreendedora","Gere uma oportunidade"];return`<div class=card><h2>🌸 7 DIAS PARA FAZER FLORESCER UM NEGÓCIO</h2><div class=row>${T.map((t,i)=>`<div class="day ${i<S.days?"dn":i==S.days?"cur":"lk"}" style="cursor:pointer" onclick="dayc(${i})">${i<S.days?"✓":i==S.days?"🌱":"🔒"}<br>Dia ${i+1}</div>`).join("")}</div><p class=mut>${S.days<7?"Dia "+(S.days+1)+": "+T[S.days]:"🏆 Selo EMPREENDEDORA BLOOM conquistado!"}</p></div>`},
h(){const H=[["Mariana","Preciso melhorar minhas fotos.",6],["Juliana","Quero encontrar novas clientes.",7]];return`<div class=card><h2>💡 EU POSSO AJUDAR</h2><p>Que problema você consegue ajudar outra empreendedora a resolver?</p>${H.map(h=>`<div class=card style="background:var(--p)"><b>${h[0]}:</b> “${h[1]}” <button class="btn s" onclick="sub.h=${h[2]};render()">Eu ajudo</button></div>`).join("")}${sub.h!=null?`<p>✨ <b>Encontramos uma possibilidade de conexão!</b></p><div class=row><button class=btn onclick="prof(${sub.h});helped()">Conhecer perfil</button><button class="btn o" onclick="helped();go('msg',{c:${sub.h}})">Enviar mensagem</button><button class="btn c" onclick="helped();parForm(${sub.h})">Criar parceria</button></div>`:""}</div>`},
u(){const E=["Conhecer o negócio","Identificar um problema","Propor solução","Criar oferta","Divulgar","Medir resultado"];return`<div class=card><h2>🌱 DUPLAS QUE FLORESCEM</h2><p>Você e Ana foram conectadas! Objetivo: criar uma parceria.</p>${E.map((e,i)=>`<div style="padding:5px 0;${i>=S.duo?"opacity:.5":""}">${i<S.duo?"✅":i==S.duo?"🌱":"⚪"} SEMANA ${i+1} — ${e}</div>`).join("")}${pb(Math.round(S.duo/6*100),1)}<p>${S.duo<6?`<button class=btn onclick=duo()>AVANÇAR ETAPA</button>`:"🏆 Parceria Bloom concluída!"}</p></div>`},r(){return V.rank()}};
function parC(p){return`<div class=card><div class="row sp"><b>${p.n}</b><span class=tag>${p.s}</span></div><span class=mut>👥 ${S.name.split(" ")[0]} + ${p.w} · 🎯 ${p.g} · ⏰ ${p.d}</span>${pb(p.p,1)}<div class=row style="margin-top:8px">${p.s=="Ativa"?`<button class="btn s" onclick="parUp('${p.n}')">Concluir etapa +20%</button>`:""}${p.s=="Recebido"?`<button class="btn s" onclick="parAcc('${p.n}')">Aceitar</button>`:""}</div></div>`}
function parUp(n){const p=S.pars.find(x=>x.n==n);p.p=Math.min(100,p.p+20);if(p.p==100){p.s="Concluída";pts(150,"Parceria concluída","🏆 Parceria Bloom concluída!")}else toast("Progresso atualizado 🌱");render()}
function parAcc(n){S.pars.find(x=>x.n==n).s="Ativa";S.par++;pts(100,"Parceria aceita");render()}
function opC(o,i){return`<div class=card><span class=tag>${o.c}</span><h3>${o.n}</h3><p class=mut>Por ${o.by} · ⏰ ${o.d} · 📍 ${o.l}<br>Competências: ${o.s}</p><button class="btn ${o.on?"on":""}" onclick="opi(${i})">${o.on?"Interesse enviado ✓":"Tenho interesse"}</button></div>`}
function opi(i){OP[i].on=1;S.opp++;pts(30,"Participar de desafio","Interesse enviado");render()}
function feedC(f,i){const p=PL[f.a]||{n:S.name,em:"🌷",col:"#f7d6e6",biz:S.biz};return`<div class=card><div class=row>${av(p)}<div><b>${p.n}</b><br><span class=mut>${p.biz}</span></div></div><p>${f.t}</p>${f.cm.map(c=>`<p class=mut>💬 ${c}</p>`).join("")}<div class=row><button class="btn o s" onclick="lk(${S.feed.indexOf(f)})">${f.lk?"💜":"❤️"} ${f.l+f.lk}</button><button class="btn o s" onclick="cm(${S.feed.indexOf(f)})">💬 Comentar</button><button class="btn o s" onclick="toast('Link copiado 🔗')">🔗 Compartilhar</button><button class="btn o s" onclick="go('msg',{c:${f.a}})">🤝 Propor colaboração</button></div></div>`}
function lk(i){S.feed[i].lk=S.feed[i].lk?0:1;render()}
function cm(i){const t=prompt("Seu comentário:");if(t){S.feed[i].cm.push(t);render()}}
function post(){const t=$("#fp").value.trim();if(!t)return toast("Escreva algo primeiro");S.feed.unshift({a:-1,t,l:0,lk:0,cm:[]});PL[-1]=null;pts(50,"Compartilhar conhecimento");render()}
function oppForm(){M(`<h3>Nova oportunidade</h3><input id=on placeholder="Título"><select id=oc><option>Parcerias<option>Clientes<option>Eventos<option>Mentorias<option>Projetos<option>Fornecedores<option>Colaborações</select><input id=os placeholder="Competências necessárias"><div class=err id=er></div><button class=btn onclick=addOpp()>Publicar</button>`)}
function addOpp(){const n=$("#on").value.trim();if(!n)return $("#er").textContent="Informe um título.";OP.unshift({n,c:$("#oc").value,by:S.name.split(" ")[0],d:"30 dias",l:"Online",s:$("#os").value||"Diversas",on:0});X();pts(150,"Criar ação colaborativa");render()}
function evp(i){EV[i].on=1;pts(30,"Participar de evento");render()}
function nt(k,i){S.nt.splice(i,1);if(k=="people")go("exp");else if(k=="par")go("par",{t:"Recebido"});else go(k=="bdg"?"jour":k)}
function lvM(i){const l=LV[i];M(`<h2>${["🌱","🌿","🪴","🌷","🌸"][i]} ${l[0]}</h2><p><b>Objetivo:</b> ${l[2]}</p><p><b>Pontos necessários:</b> ${l[1]}</p><p><b>Benefícios:</b> ${l[3]}</p><p><b>Missões:</b> conectar-se, ajudar alguém, criar uma parceria.</p><button class=btn onclick=X()>Fechar</button>`)}
function fl(){const q=(sub.q||"").toLowerCase();$("#gl").innerHTML=PL.filter(p=>(!sub.a||p.area==sub.a)&&(p.n+p.biz+p.area+p.comp).toLowerCase().includes(q)).map(p=>pc(p)).join("")||"<p class=mut>Nenhuma empreendedora encontrada 🌱</p>"}
function wchk(i){S.wc[i]=S.wc[i]?0:1;if(S.wc.every(x=>x)){S.wd=1;pts(50,"Desafio da semana","🌸 DESAFIO CONCLUÍDO!");M(`<div style="text-align:center"><h1>🌸</h1><h2>Você floresceu mais uma vez! 🌷</h2><button class=btn onclick=X()>Lindo!</button></div>`)}render()}
function dayc(i){if(i>S.days)return toast("Dia bloqueado 🔒");if(i<S.days)return toast("Dia concluído ✓");S.days++;pts(30,"Dia "+(i+1)+" concluído");if(S.days==7){S.badges[4]=1;pts(100,"Selo Empreendedora Bloom","🏆 EMPREENDEDORA BLOOM!")}render()}
function helped(){if(!S.helped){S.helped=1;S.help++;pts(40,"Ajudar outra empreendedora")}}
function duo(){S.duo++;if(S.duo==6){pts(100,"Parceria Bloom concluída","🏆 Parceria Bloom concluída!");S.par++}else toast("Etapa avançada 🌱");render()}
function send(c){const i=$("#mi"),t=i.value.trim();if(!t)return;S.ch[c].push([t,1]);i.value="";render();setTimeout(()=>{S.ch[c].push([["Que ideia linda! 💜","Vamos marcar uma call?","Adorei, topo sim! 🌸","Me manda mais detalhes ✨"][Math.random()*4|0],0]);if(route=="msg"&&(sub.c??1)==c)render()},1000);const e=$("#ch");if(e)e.scrollTop=1e9}
const KB=[["identidade|design|logo|visual",[3,4,7]],["foto",[6,3,5]],["social|instagram|conteúdo",[7,0,1]],["site|app|tecnologia",[2,3,0]]];
function ask(q){q=q||$("#ai").value.trim();if(!q)return;S.ai.push([q,1]);let r=(KB.find(k=>new RegExp(k[0],"i").test(q))||[0,[3,4,7]])[1];S.ai.push([`Encontrei ótimas conexões para você:<br>`+r.map((id,k)=>`<b>${PL[id].n}</b> · ${PL[id].comp[0]} · ${94-k*5}% compat. <button class="btn o s" onclick="prof(${id})">Ver perfil</button><br>`).join("")+`<b>Quer que eu apresente vocês?</b><br><button class="btn s" onclick="intro(${r[0]})">Sim, apresentar</button> <button class="btn o s" onclick="go('exp')">Ver perfis</button> <button class="btn o s" onclick="S.ai=[['Olá! O que você precisa hoje?',0]];render()">Nova busca</button>`,0]);render();const e=$("#ch");e.scrollTop=1e9}
function intro(i){S.cn.add(i);S.conn++;S.ai.push(["Apresentação enviada para "+PL[i].n+"! 💜",0]);pts(20,"Nova conexão","✨ NOVA CONEXÃO!");render()}
function edit(){M(`<h3>Editar perfil</h3><input id=en value="${S.name}"><input id=eb value="${S.biz}"><div class=err id=er></div><button class=btn onclick="const n=$('#en').value.trim(),b=$('#eb').value.trim();if(!n||!b)return $('#er').textContent='Preencha os campos.';S.name=n;S.biz=b;X();toast('Perfil atualizado ✓');render()">Salvar</button>`)}
function setM(x){M(`<h3>${x}</h3><p class=mut>${x=="Sobre o BLOOM"?"O BLOOM é uma comunidade digital criada para mulheres que querem transformar conexões em parcerias, conhecimento e oportunidades reais.":"Ajuste suas preferências desta seção."}</p>${x=="Preferências"?`<button class=btn onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='light'?'dark':'light';X()">Alternar tema</button>`:`<label class=row><input type=checkbox checked style="width:auto"> Ativado</label><button class=btn onclick="X();toast('Salvo ✓')">Salvar</button>`}`)}
login();
</script></body></html>
